<div class="body">
    <h1> Operation Patient List</h1>
    <div class="search-bar" style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;">
        <mat-form-field appearance="outline">
            <mat-label>Patient ID</mat-label>
            <input matInput [(ngModel)]="searchPatientId" placeholder="Search by ID">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="searchName" placeholder="Search by Name">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input matInput [(ngModel)]="searchPhone" placeholder="Search by Phone">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>City</mat-label>
            <input matInput [(ngModel)]="searchCity" placeholder="Search by City">
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="onSearch()">Search</button>
        <button mat-raised-button color="accent" (click)="onClearSearch()">Clear</button>
        <span style="flex: 1 1 auto;"></span>
        <button mat-raised-button color="primary" (click)="exportToExcel()">Export to Excel</button>
        <input type="file" accept=".xlsx, .xls" style="display:none" #importInput (change)="importFromExcel($event)">
        <button mat-raised-button color="accent" (click)="importInput.click()">Import from Excel</button>
    </div>
    <mat-table class="patient-table mat-elevation-z8" [dataSource]="dataSource">
        <ng-container matColumnDef="patientId">
            <mat-header-cell *matHeaderCellDef >PatientId</mat-header-cell>
            <mat-cell *matCellDef="let patient">{{patient.patientId}}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
            <mat-cell *matCellDef="let patient">{{patient.name}}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="drName">
            <mat-header-cell *matHeaderCellDef>Dr Name</mat-header-cell>
            <mat-cell *matCellDef="let patient">{{patient.drName}}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="gender">
            <mat-header-cell *matHeaderCellDef>Gender</mat-header-cell>
            <mat-cell *matCellDef="let patient">{{patient.gender}}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="phone">
            <mat-header-cell *matHeaderCellDef>phone</mat-header-cell>
            <mat-cell *matCellDef="let patient">{{patient.contact}}</mat-cell>
        </ng-container>
              <ng-container matColumnDef="city">
            <mat-header-cell *matHeaderCellDef>city</mat-header-cell>
            <mat-cell *matCellDef="let patient">{{patient.city}}</mat-cell>
        </ng-container>
      
        <ng-container matColumnDef="action" *ngIf="isSuperAdmin">
            <mat-header-cell *matHeaderCellDef>Action</mat-header-cell>
            <mat-cell  *matCellDef="let patient">
                      <div class="action-buttons">
                <button mat-button class="mat-raised-button mat-primary table-btn" (click)="editPatient(patient.patientId)">  <mat-icon>edit</mat-icon> </button>
                <button mat-button class="mat-raised-button mat-warn table-btn" (click)="deletePatient(patient.patientId)">  <mat-icon>delete</mat-icon> </button>
                </div>
            </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
    </mat-table>
</div>

<mat-paginator  class="page"
                [length]="total"
                [pageSize]="5"
                [pageSizeOptions]="[5, 10, 15, 20]" >
</mat-paginator>
