<h2 mat-dialog-title><mat-icon>receipt_long</mat-icon><span>Payment receipt #{{ record.id }}<small>Thermal print preview</small></span></h2>
<mat-dialog-content class="payment-slip-content"><app-thermal-receipt-preview [html]="html" [paperWidth]="paperWidth"></app-thermal-receipt-preview></mat-dialog-content>
<mat-dialog-actions class="payment-slip-actions"><label>Paper <select [ngModel]="paperWidth" (ngModelChange)="changePaperWidth($event)" aria-label="Payment receipt paper size"><option [ngValue]="58">58 mm</option><option [ngValue]="80">80 mm</option></select></label><button mat-stroked-button type="button" (click)="close()">Close</button><button mat-flat-button color="primary" type="button" (click)="print()"><mat-icon>print</mat-icon>Print receipt</button></mat-dialog-actions>
