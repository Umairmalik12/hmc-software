<h2 mat-dialog-title>{{edit ? 'Update Medicine Record' : 'Add New Medicine Record'}}</h2>

<form [formGroup]="medicineForm" (ngSubmit)="onSubmit()" novalidate>
    <mat-dialog-content class="outer-input-section">
       
  <mat-form-field appearance="fill">
            <mat-label>Created At</mat-label>
            <input matInput readonly [value]="f.get('createdAt')?.value | date:'dd/MM/yy h:mm a'">
        </mat-form-field>
    

        <mat-form-field appearance="fill">
            <mat-label>Room No</mat-label>
            <input matInput formControlName="roomNo">
            <mat-error *ngIf="f.get('roomNo')?.errors?.required">Room No is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Patient Name</mat-label>
            <input matInput formControlName="patientName">
            <mat-error *ngIf="f.get('patientName')?.errors?.required">Patient name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Doctor Name</mat-label>
            <input matInput formControlName="doctorName">
        </mat-form-field>

        <div class="medicines-section">
            <h3>Medicines</h3>
            <div formArrayName="medicines">
                <div *ngFor="let med of medicines.controls; let i = index" [formGroupName]="i" class="medicine-row">
                    <mat-form-field appearance="fill" class="medicine-field">
                        <mat-label>Medicine Name</mat-label>
                        <input matInput formControlName="medicineName">
                        <mat-error *ngIf="med.get('medicineName')?.errors?.required">Medicine name is required</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="quantity-field">
                        <mat-label>Quantity</mat-label>
                        <input matInput type="number" formControlName="quantity">
                        <mat-error *ngIf="med.get('quantity')?.errors?.required">Quantity is required</mat-error>
                        <mat-error *ngIf="med.get('quantity')?.errors?.min">Quantity must be positive</mat-error>
                    </mat-form-field>

                    <button mat-icon-button color="warn" type="button" (click)="removeMedicine(i)" *ngIf="medicines.length > 1">
                        <mat-icon>remove</mat-icon>
                    </button>
                </div>
            </div>
            <button mat-raised-button type="button" (click)="addMedicine()">Add Medicine</button>
        </div>
      
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="!f.valid">Submit</button>
        <button mat-raised-button color="warn" type="button" (click)="close()">Cancel</button>
    </mat-dialog-actions>
</form>
