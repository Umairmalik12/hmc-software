<h2 mat-dialog-title><mat-icon>receipt_long</mat-icon><span>Daily medicine receipt<small>Preview of the selected saved record</small></span></h2>
<mat-dialog-content class="medicine-slip-content"><div class="medicine-preview-paper" [class.medicine-paper-58]="paperWidth === 58" [innerHTML]="html"></div></mat-dialog-content>
<mat-dialog-actions class="medicine-slip-actions"><label>Paper <select [(ngModel)]="paperWidth" aria-label="Daily medicine receipt paper size"><option [ngValue]="80">80 mm</option><option [ngValue]="58">58 mm</option></select></label><button mat-stroked-button type="button" (click)="close()">Close</button><button mat-flat-button color="primary" type="button" (click)="print()"><mat-icon>print</mat-icon>Print</button></mat-dialog-actions>
