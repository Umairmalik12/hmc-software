<h2 mat-dialog-title><mat-icon>print</mat-icon><span class="preview-title">Monthly expense sheet<small>{{ period }} &middot; A4 landscape</small></span><button mat-icon-button type="button" mat-dialog-close aria-label="Close monthly preview"><mat-icon>close</mat-icon></button></h2>
<div class="preview-toolbar" role="group" aria-label="Preview zoom"><div class="preview-count"><mat-icon>description</mat-icon><span>{{ count }} {{ count === 1 ? 'entry' : 'entries' }}<strong>Rs {{ total | number:'1.2-2' }}</strong></span></div><div class="zoom-controls"><button mat-stroked-button type="button" (click)="fit()" [class.selected]="fitToWidth" [attr.aria-pressed]="fitToWidth" aria-label="Fit expense sheet to width"><mat-icon>fit_screen</mat-icon>Fit width</button><button mat-icon-button type="button" (click)="zoom(-1)" [disabled]="scale <= 0.15" aria-label="Zoom out"><mat-icon>remove</mat-icon></button><button mat-button type="button" (click)="actualSize()" aria-label="Show expense sheet at 100 percent" title="Show at 100%">{{ zoomPercent }}%</button><button mat-icon-button type="button" (click)="zoom(1)" [disabled]="scale >= 1.5" aria-label="Zoom in"><mat-icon>add</mat-icon></button></div></div>
<mat-dialog-content #viewport class="preview-viewport" tabindex="0" aria-label="Monthly expense document. Use zoom controls to enlarge the sheet."><div class="expense-preview-stage" [style.width.px]="paperWidth * scale" [style.height.px]="paperHeight * scale"><div #paper class="expense-sheet-preview" [style.width.px]="paperWidth" [style.transform]="'scale(' + scale + ')'" [innerHTML]="safeHtml"></div></div></mat-dialog-content>
<mat-dialog-actions><button mat-stroked-button type="button" mat-dialog-close>Close</button><button mat-flat-button color="primary" type="button" (click)="print()"><mat-icon>print</mat-icon>Print sheet</button></mat-dialog-actions>
