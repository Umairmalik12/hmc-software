<div>
    <div class="header">
        <span class="login-brand"><mat-icon>local_hospital</mat-icon></span><h1>Haq Medical Center</h1>
        <p>A calmer workspace for better patient care.</p>
    </div>
    <div class="login-box">
        <form class="login-form" (ngSubmit)="onSubmit()" #f="ngForm">
            <mat-card>
                <mat-card-header>
                    <mat-card-title class="card-title">Welcome back</mat-card-title>
                </mat-card-header>
                <mat-card-content class="form-content">
                    <mat-form-field appearance="outline">
                        <mat-label>Email</mat-label>
                        <input matInput type="email" autocomplete="username" ngModel name="username" required email #username="ngModel">
                        <mat-error *ngIf="username.errors?.required">Email is required</mat-error>
                        <mat-error *ngIf="username.errors?.email">Enter a valid email address</mat-error>
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Password</mat-label>
                        <input matInput [type]="hide ? 'password' : 'text'" autocomplete="current-password" ngModel name="password" required
                            #password="ngModel">
                        <button mat-icon-button matIconSuffix type="button" (click)="hide = !hide" [attr.aria-label]="hide ? 'Show password' : 'Hide password'"><mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon></button><mat-error *ngIf="password.errors?.required">Password is required</mat-error>
                    </mat-form-field>
                </mat-card-content>
                <p class="login-error" role="alert" *ngIf="errorMessage">{{errorMessage}}</p>
                <mat-card-actions class="form-content form-actions">
                    <button mat-stroked-button type="submit" [appBusy]="signingIn || restoring" [disabled]="signingIn || restoring"><mat-icon>login</mat-icon>{{ restoring ? 'Restoring session...' : signingIn ? 'Signing in...' : 'Sign in' }}</button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
    <footer class="footer-credit">
        <p>Created by <strong>Umair Javed</strong> — Developer | MPhil Scholar — <strong>NextGen Coders Software
                House</strong></p>
    </footer>
</div>
