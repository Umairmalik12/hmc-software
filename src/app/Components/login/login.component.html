<div>
    <div class="header">
        <h1>{{title | uppercase}}</h1>
        <p>Home | {{title}}</p>
    </div>
    <div class="login-box">
        <form class="login-form" (ngSubmit)="onSubmit()" #f="ngForm">
            <mat-card>
                <mat-card-header>
                    <mat-card-title class="card-title">Login</mat-card-title>
                </mat-card-header>
                <mat-card-content class="form-content">
                    <mat-form-field>
                        <mat-label>Email</mat-label>
                        <input matInput type="email" ngModel name="username" required email #username="ngModel">
                        <mat-error *ngIf="username.errors?.required">Email is required</mat-error>
                        <mat-error *ngIf="username.errors?.email">Enter a valid email address</mat-error>
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Password</mat-label>
                        <input matInput [type]="hide ? 'password' : 'text'" ngModel name="password" required
                            #password="ngModel">
                        <mat-error *ngIf="password.errors?.required">Password is required</mat-error>
                    </mat-form-field>
                </mat-card-content>
                <p class="login-error" *ngIf="errorMessage">{{errorMessage}}</p>
                <mat-card-actions class="form-content form-actions">
                    <button mat-stroked-button type="submit">Login</button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
    <footer class="footer-credit">
        <p>Created by <strong>Umair Javed</strong> — Developer | MPhil Scholar — <strong>NextGen Coders Software
                House</strong></p>
    </footer>
</div>
