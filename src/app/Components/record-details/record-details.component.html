<h2 mat-dialog-title><mat-icon>visibility</mat-icon><span class="record-preview-title">{{ title }}<small>Read-only record preview</small></span><button mat-icon-button type="button" mat-dialog-close aria-label="Close record preview"><mat-icon>close</mat-icon></button></h2>
<mat-dialog-content><dl class="record-details-grid"><div *ngFor="let field of fields" class="record-detail" [class.record-detail-wide]="field.wide" [class.record-detail-money]="field.money"><dt>{{ field.label }}</dt><dd [class.record-detail-empty]="field.empty">{{ field.value }}</dd></div></dl><div *ngIf="!fields.length" class="record-preview-empty"><mat-icon>description</mat-icon>No record details available.</div></mat-dialog-content>
<mat-dialog-actions><span class="record-preview-note"><mat-icon>lock_outline</mat-icon>Record details</span><button mat-stroked-button type="button" mat-dialog-close>Close</button></mat-dialog-actions>
