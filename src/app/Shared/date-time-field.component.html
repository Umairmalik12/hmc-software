<div class="date-time-fields" [class.combined]="kind === 'datetime'">
  <mat-form-field *ngIf="kind !== 'time'" appearance="outline"><mat-label>{{ kind === 'datetime' ? label + ' · date' : label }}</mat-label><input matInput [matDatepicker]="picker" [value]="date" [min]="minDate" [max]="maxDate" [disabled]="disabled" [required]="required" [errorStateMatcher]="matcher" readonly placeholder="Select date" (dateChange)="selectDate($event.value)" (click)="openDate()" (keydown.enter)="openDate($event)" (keydown.space)="openDate($event)" (blur)="touch()" [attr.aria-label]="kind === 'datetime' ? label + ' date' : label" aria-haspopup="dialog" [attr.aria-expanded]="picker.opened"><button *ngIf="date" mat-icon-button matIconSuffix type="button" class="picker-clear" [disabled]="disabled" (click)="clearDate()" [attr.aria-label]="'Clear ' + label + ' date'" title="Clear date"><mat-icon>close</mat-icon></button><mat-datepicker-toggle matIconSuffix [for]="picker" [disabled]="disabled" [attr.aria-label]="'Choose ' + label + ' date'"></mat-datepicker-toggle><mat-datepicker #picker (closed)="touch()"></mat-datepicker><mat-hint *ngIf="hint">{{ hint }}</mat-hint><mat-error>{{ errorText }}</mat-error></mat-form-field>
  <mat-form-field *ngIf="kind !== 'date'" appearance="outline"><mat-label>{{ kind === 'datetime' ? label + ' · time' : label }}</mat-label><input matInput [value]="displayTime" [disabled]="disabled" [required]="required" [errorStateMatcher]="matcher" readonly placeholder="Select time" (click)="openTime()" (keydown.enter)="openTime($event)" (keydown.space)="openTime($event)" (blur)="touch()" [attr.aria-label]="kind === 'datetime' ? label + ' time' : label" aria-haspopup="dialog"><button *ngIf="time" mat-icon-button matIconSuffix type="button" class="picker-clear" [disabled]="disabled" (click)="clearTime()" [attr.aria-label]="'Clear ' + label + ' time'" title="Clear time"><mat-icon>close</mat-icon></button><button mat-icon-button matIconSuffix type="button" class="picker-trigger" [disabled]="disabled" (click)="openTime()" [attr.aria-label]="'Choose ' + label + ' time'" title="Choose time"><mat-icon>schedule</mat-icon></button><mat-hint *ngIf="kind === 'time' && hint">{{ hint }}</mat-hint><mat-error>{{ errorText }}</mat-error></mat-form-field>
</div>
